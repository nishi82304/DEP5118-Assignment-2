<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8' />
    <title>A Town within the City</title>
    <meta name='viewport' content='initial-scale=1,maximum-scale=1,user-scalable=no' />
    <link rel="icon" type="image/x-icon"
        href="https://raw.githubusercontent.com/mapbox/assembly/publisher-staging/src/svgs/mapbox.svg">
    <script src='https://api.tiles.mapbox.com/mapbox-gl-js/v3.8.0/mapbox-gl.js'></script>
    <link href='https://api.tiles.mapbox.com/mapbox-gl-js/v3.8.0/mapbox-gl.css' rel='stylesheet' />
    <script src="https://cdn.jsdelivr.net/npm/mapbox-gl-globe-minimap@1.2.0/dist/bundle.js"></script>
    <script src="https://unpkg.com/scrollama"></script>
    <style>
        
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        a,
        a:hover,
        a:visited {
            color: #0071bc;
        }

        #map {
            top: 0;
            height: 100vh;
            width: 100vw;
            position: fixed;
        }

        #header {
            margin: auto;
            width: 100%;
            position: relative;
            z-index: 5;
        }
        #header h2 {
            margin: 0;
            padding: 2vh 2vw;
            text-align: center;
            font-weight: 500;
            font-size: 1.25rem;
        }
        #header h1,
        #header p {
            margin: 0;
            padding: 2vh 2vw;
            text-align: center;
        }

        #footer {
            width: 100%;
            min-height: 5vh;
            padding-top: 2vh;
            padding-bottom: 2vh;
            text-align: center;
            line-height: 25px;
            font-size: 13px;
            position: relative;
            z-index: 5;
        }

        #features {
            padding-top: 10vh;
            padding-bottom: 10vh;
        }

        .hidden {
            visibility: hidden;
        }

        .centered {
            width: 50vw;
            margin: 0 auto;
        }

        .lefty {
            width: 33vw;
            margin-left: 5vw;
        }

        .righty {
            width: 33vw;
            margin-left: 62vw;
        }

        .fully {
            width: 100%;
            margin: auto;
        }

        .light {
            color: #444;
            background-color: #fafafa;
        }

        .dark {
            color: #fafafa;
            background-color: #444;
        }

        .step {
            padding-bottom: 50vh;
            /* margin-bottom: 10vh; */
            opacity: 0.25;
        }

        .step.active {
            opacity: 0.9;
        }

        .step div {
            padding: 25px 50px;
            line-height: 25px;
            font-size: 13px;
        }

        .step img {
            width: 100%;
        }

        @media (max-width: 750px) {

            .centered,
            .lefty,
            .righty,
            .fully {
                width: 90vw;
                margin: 0 auto;
            }
        }

        /* Legend box, driven by the `legend` array on each chapter in config.js */
        #legend {
            position: fixed;
            left: 20px;
            bottom: 20px;
            z-index: 10;
            padding: 12px 14px;
            border-radius: 4px;
            font-size: 12px;
            line-height: 18px;
            max-width: 240px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
            opacity: 0;
            transition: opacity 400ms ease;
            pointer-events: none;
        }

        #legend.visible {
            opacity: 1;
        }

        #legend .legend-title {
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            font-size: 10px;
            opacity: 0.7;
        }

        #legend .legend-subhead {
            font-weight: 600;
            font-size: 11px;
            margin-top: 10px;
            margin-bottom: 5px;
        }

        #legend .legend-subhead:first-of-type {
            margin-top: 0;
        }

        #legend .legend-bar {
            height: 12px;
            border-radius: 2px;
            border: 1px solid rgba(0, 0, 0, 0.2);
            margin-bottom: 3px;
        }

        #legend .legend-ends {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            opacity: 0.75;
            margin-bottom: 4px;
        }

        #legend .legend-row {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }

        #legend .legend-row:last-child {
            margin-bottom: 0;
        }

        #legend .legend-swatch {
            width: 14px;
            height: 14px;
            margin-right: 8px;
            flex-shrink: 0;
            border-radius: 2px;
            border: 1px solid rgba(0, 0, 0, 0.2);
        }

        @media (max-width: 750px) {
            #legend {
                left: 10px;
                bottom: 10px;
                font-size: 11px;
                max-width: 160px;
            }
        }

        /* Fix issue on mobile browser where scroll breaks  */
        .mapboxgl-canvas-container.mapboxgl-touch-zoom-rotate.mapboxgl-touch-drag-pan,
        .mapboxgl-canvas-container.mapboxgl-touch-zoom-rotate.mapboxgl-touch-drag-pan .mapboxgl-canvas {
            touch-action: unset;
        }
    </style>
</head>

<body>

    <div id="map"></div>
    <div id="legend"></div>
    <div id="story"></div>

    <script src="./config.js"></script>
    <script>
        var initLoad = true;
        var layerTypes = {
            'fill': ['fill-opacity'],
            'line': ['line-opacity'],
            'circle': ['circle-opacity', 'circle-stroke-opacity'],
            'symbol': ['icon-opacity', 'text-opacity'],
            'raster': ['raster-opacity'],
            'fill-extrusion': ['fill-extrusion-opacity'],
            'heatmap': ['heatmap-opacity']
        }

        var alignments = {
            'left': 'lefty',
            'center': 'centered',
            'right': 'righty',
            'full': 'fully',
            'fully': 'fully'
        }

        function getLayerPaintType(layer) {
            var layerType = map.getLayer(layer).type;
            return layerTypes[layerType];
        }

        function setLayerOpacity(layer) {
            if (!map.getLayer(layer.layer)) {
                console.warn('Layer not found in the published style: "' + layer.layer +
                    '". Check the spelling against the Layers panel in Mapbox Studio.');
                return;
            }
            var paintProps = getLayerPaintType(layer.layer);
            paintProps.forEach(function (prop) {
                var options = {};
                if (layer.duration) {
                    var transitionProp = prop + "-transition";
                    options = { "duration": layer.duration };
                    map.setPaintProperty(layer.layer, transitionProp, options);
                }
                map.setPaintProperty(layer.layer, prop, layer.opacity, options);
            });
        }

        // Build the legend box for a chapter. An empty or missing `legend`
        // array hides it.
        var legendEl = document.getElementById('legend');
        legendEl.classList.add(config.theme);

        function setLegend(chapter) {
            var rows = chapter.legend || [];
            if (rows.length === 0) {
                legendEl.classList.remove('visible');
                return;
            }
            legendEl.innerHTML = '';
            var heading = document.createElement('div');
            heading.className = 'legend-title';
            heading.innerText = chapter.legendTitle || 'Legend';
            legendEl.appendChild(heading);
            rows.forEach(function (row) {
                // A row with `heading` instead of `color` is a subheading,
                // used when one chapter shows two different layers.
                // A row with `gradient` renders a continuous colour bar with
                // a label at each end, for layers styled across a data range.
                if (row.gradient) {
                    var bar = document.createElement('div');
                    bar.className = 'legend-bar';
                    bar.style.background = 'linear-gradient(to right, ' + row.gradient.join(', ') + ')';
                    legendEl.appendChild(bar);
                    var ends = document.createElement('div');
                    ends.className = 'legend-ends';
                    ends.innerHTML = '<span>' + row.min + '</span><span>' + row.max + '</span>';
                    legendEl.appendChild(ends);
                    return;
                }
                if (row.heading) {
                    var sub = document.createElement('div');
                    sub.className = 'legend-subhead';
                    sub.innerText = row.heading;
                    legendEl.appendChild(sub);
                    return;
                }
                var line = document.createElement('div');
                line.className = 'legend-row';
                var swatch = document.createElement('span');
                swatch.className = 'legend-swatch';
                swatch.style.backgroundColor = row.color;
                var label = document.createElement('span');
                label.innerText = row.label;
                line.appendChild(swatch);
                line.appendChild(label);
                legendEl.appendChild(line);
            });
            legendEl.classList.add('visible');
        }

        var story = document.getElementById('story');
        var features = document.createElement('div');
        features.setAttribute('id', 'features');

        var header = document.createElement('div');

        if (config.title) {
            var titleText = document.createElement('h1');
            titleText.innerText = config.title;
            header.appendChild(titleText);
        }

        if (config.subtitle) {
            var subtitleText = document.createElement('h2');
            subtitleText.innerText = config.subtitle;
            header.appendChild(subtitleText);
        }

        if (config.byline) {
            var bylineText = document.createElement('p');
            bylineText.innerText = config.byline;
            header.appendChild(bylineText);
        }

        if (header.innerText.length > 0) {
            header.classList.add(config.theme);
            header.setAttribute('id', 'header');
            story.appendChild(header);
        }

        config.chapters.forEach((record, idx) => {
            var container = document.createElement('div');
            var chapter = document.createElement('div');

            if (record.title) {
                var title = document.createElement('h3');
                title.innerText = record.title;
                chapter.appendChild(title);
            }

            if (record.image) {
                var image = new Image();
                image.src = record.image;
                chapter.appendChild(image);
            }

            if (record.description) {
                var story = document.createElement('p');
                story.innerHTML = record.description;
                chapter.appendChild(story);
            }

            container.setAttribute('id', record.id);
            container.classList.add('step');
            if (idx === 0) {
                container.classList.add('active');
            }

            chapter.classList.add(config.theme);
            container.appendChild(chapter);
            container.classList.add(alignments[record.alignment] || 'centered');
            if (record.hidden) {
                container.classList.add('hidden');
            }
            features.appendChild(container);
        });

        story.appendChild(features);

        var footer = document.createElement('div');

        if (config.footer) {
            var footerText = document.createElement('p');
            footerText.innerHTML = config.footer;
            footer.appendChild(footerText);
        }

        if (footer.innerText.length > 0) {
            footer.classList.add(config.theme);
            footer.setAttribute('id', 'footer');
            story.appendChild(footer);
        }

        mapboxgl.accessToken = config.accessToken;

        var map = new mapboxgl.Map({
            container: 'map',
            style: config.style,
            center: config.chapters[0].location.center,
            zoom: config.chapters[0].location.zoom,
            bearing: config.chapters[0].location.bearing,
            pitch: config.chapters[0].location.pitch,
            interactive: false,
            projection: config.projection
        });

        // Create a inset map if enabled in config.js
        if (config.inset) {
            map.addControl(
                new GlobeMinimap({ ...config.insetOptions }),
                config.insetPosition
            );
        }

        if (config.showMarkers) {
            var marker = new mapboxgl.Marker({ color: config.markerColor });
            marker.setLngLat(config.chapters[0].location.center).addTo(map);
        }

        // instantiate the scrollama
        var scroller = scrollama();



        // ===================================================================
        // FALLBACK: load the four layers from local GeoJSON.
        //
        // This runs ONLY if the published Mapbox style does not contain the
        // layers, which is the case while the Studio publish is failing. If
        // you later publish the style successfully, this block detects the
        // layers already present and does nothing, so you can leave it in
        // place either way.
        //
        // Colours and heights below are copied from your Studio style, so
        // the map looks the same on both paths. The layer ids are identical,
        // which is why config.js needs no changes.
        // ===================================================================
        function addFallbackLayers() {
            if (map.getLayer('reclaimed-land')) {
                console.log('Published style already has the custom layers. Fallback not used.');
                return;
            }
            console.warn('Published style has no custom layers. Loading them from ./data/ instead.');

            // All six read from ./data/. Nothing here depends on a Mapbox
            // tileset id, so re-uploading in Studio can never break this.
            var geojsonSources = {
                'src-reclaimed-land': './data/reclaimed_land.geojson',
                'src-seven-islands': './data/seven_islands.geojson',
                'src-mills': './data/Mills_of_Girangaon.geojson',
                'src-bdd-chawls': './data/BDD_Chawls.geojson',
                'src-bdd-chawls-worli': './data/BDD_Chawls_Worli.geojson',
                'src-redevelopment': './data/Redevelopment_Project_Plan.geojson'
            };
            Object.keys(geojsonSources).forEach(function (id) {
                map.addSource(id, { type: 'geojson', data: geojsonSources[id] });
            });

            // Flat fills first, then the extrusions, so stacking matches Studio.
            map.addLayer({
                id: 'reclaimed-land', type: 'fill', source: 'src-reclaimed-land',
                paint: {
                    // Desaturated so the made ground reads as a separate
                    // thing rather than as another step in the island ramp.
                    'fill-color': 'hsl(106, 50%, 68%)',
                    'fill-outline-color': 'hsl(106, 48%, 59%)',
                    'fill-opacity': 0
                }
            });
            map.addLayer({
                id: 'seven-islands', type: 'fill', source: 'src-seven-islands',
                paint: {
                    // Quantitative: colour driven by the year_joined field.
                    // Oldest land darkest, newest lightest.
                    'fill-color': [
                        'interpolate', ['linear'], ['get', 'year_joined'],
                        1661, 'hsl(100, 82%, 85%)',
                        1707, 'hsl(101, 51%, 62%)',
                        1753, 'hsl(102, 43%, 52%)',
                        1799, 'hsl(102, 50%, 43%)',
                        1845, 'hsl(100, 98%, 24%)'
                    ],
                    'fill-outline-color': 'hsl(106, 48%, 59%)',
                    'fill-opacity': 0
                }
            });
            map.addLayer({
                id: 'mills-of-girangaon', type: 'fill', source: 'src-mills',
                paint: {
                    // Government / Private. Unmatched falls back to grey so a
                    // gap in the data never masquerades as a private mill.
                    'fill-color': [
                        'interpolate', ['linear'], ['get', 'area_ha'],
                        2, 'hsl(189, 72%, 77%)',
                        5, 'hsl(193, 44%, 63%)',
                        8, 'hsl(194, 37%, 56%)',
                        11, 'hsl(196, 33%, 49%)',
                        14, 'hsl(197, 47%, 36%)'
                    ],
                    'fill-outline-color': 'hsl(0, 0%, 0%)',
                    'fill-opacity': 0
                }
            });
            map.addLayer({
                id: 'bdd-chawls', type: 'fill', source: 'src-bdd-chawls',
                paint: {
                    'fill-color': [
                        'interpolate', ['linear'], ['get', 'chawls_n'],
                        12, 'hsl(38, 84%, 83%)',
                        30, 'hsl(25, 79%, 65%)',
                        48, 'hsl(23, 76%, 58%)',
                        121, 'hsl(23, 96%, 42%)'
                    ],
                    'fill-opacity': 0
                }
            });
            map.addLayer({
                id: 'bdd-chawls-worli', type: 'fill-extrusion', source: 'src-bdd-chawls-worli',
                paint: {
                    'fill-extrusion-color': 'hsl(302, 0%, 100%)',
                    'fill-extrusion-height': 12,
                    'fill-extrusion-opacity': 0
                }
            });
            map.addLayer({
                id: 'redevelopment-project-plan', type: 'fill-extrusion', source: 'src-redevelopment',
                paint: {
                    // Note the trailing space in 'Amenities ', which is how the
                    // value appears in the data.
                    'fill-extrusion-color': [
                        'interpolate', ['linear'], ['get', 'Height'],
                        1, 'hsl(360, 100%, 75%)',
                        3, 'hsl(148, 66%, 76%)',
                        29, 'hsl(219, 70%, 64%)',
                        40, 'hsl(310, 65%, 64%)',
                        66, 'hsl(221, 67%, 32%)'
                    ],
                    'fill-extrusion-height': [
                        'match', ['get', 'Type'],
                        'Rehab', 120,
                        'Sale', 198,
                        'Commercial', 87,
                        'Police', 4,
                        12
                    ],
                    'fill-extrusion-opacity': 0
                }
            });
        }

        map.on("load", function () {
            addFallbackLayers();

            if (config.use3dTerrain) {
                map.addSource('mapbox-dem', {
                    'type': 'raster-dem',
                    'url': 'mapbox://mapbox.mapbox-terrain-dem-v1',
                    'tileSize': 512,
                    'maxzoom': 14
                });
                // add the DEM source as a terrain layer with exaggerated height
                map.setTerrain({ 'source': 'mapbox-dem', 'exaggeration': 1.5 });

                // add a sky layer that will show when the map is highly pitched
                map.addLayer({
                    'id': 'sky',
                    'type': 'sky',
                    'paint': {
                        'sky-type': 'atmosphere',
                        'sky-atmosphere-sun': [0.0, 0.0],
                        'sky-atmosphere-sun-intensity': 15
                    }
                });
            };

            // setup the instance, pass callback functions
            scroller
                .setup({
                    step: '.step',
                    offset: 0.5,
                    progress: true
                })
                .onStepEnter(async response => {
                    var current_chapter = config.chapters.findIndex(chap => chap.id === response.element.id);
                    var chapter = config.chapters[current_chapter];

                    response.element.classList.add('active');
                    setLegend(chapter);
                    map[chapter.mapAnimation || 'flyTo'](chapter.location);

                    if (config.showMarkers) {
                        marker.setLngLat(chapter.location.center);
                    }
                    if (chapter.onChapterEnter.length > 0) {
                        chapter.onChapterEnter.forEach(setLayerOpacity);
                    }
                    if (chapter.callback) {
                        window[chapter.callback]();
                    }
                    if (chapter.rotateAnimation) {
                        map.once('moveend', () => {
                            const rotateNumber = map.getBearing();
                            map.rotateTo(rotateNumber + 180, {
                                duration: 30000, easing: function (t) {
                                    return t;
                                }
                            });
                        });
                    }
                    if (config.auto) {
                        var next_chapter = (current_chapter + 1) % config.chapters.length;
                        map.once('moveend', () => {
                            document.querySelectorAll('[data-scrollama-index="' + next_chapter.toString() + '"]')[0].scrollIntoView();
                        });
                    }
                })
                .onStepExit(response => {
                    var chapter = config.chapters.find(chap => chap.id === response.element.id);
                    response.element.classList.remove('active');
                    if (chapter.onChapterExit.length > 0) {
                        chapter.onChapterExit.forEach(setLayerOpacity);
                    }
                });


            if (config.auto) {
                document.querySelectorAll('[data-scrollama-index="0"]')[0].scrollIntoView();
            }
        });    

    </script>

</body>

</html>
